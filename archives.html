<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sissokassem — Archives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #120c1e; --bg-alt: #170f28; --surface: #1e1636; --surface-hi: #271d45;
    --border: #352a58; --text: #e9e4f7; --text-muted: #9587bd; --text-dim: #6c5f96;
    --accent: #a78bfa; --accent-bright: #d8c9ff; --green: #7ee787; --pink: #f0a8e0;
    --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif; --sidebar-w: 232px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body{
    background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.6;
    background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(167,139,250,0.15), transparent);
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 940px; margin: 0 auto; padding: 0 28px; }

  /* SIDEBAR REPLICATED */
  .sidebar{
    position: fixed; top:0; left:0; height:100vh; width: var(--sidebar-w);
    background: var(--bg-alt); border-right: 1px solid var(--border);
    display:flex; flex-direction:column; justify-content:space-between; padding: 26px 22px; z-index: 100;
  }
  .sb-top .logo{ font-family: var(--mono); font-weight:700; font-size: 1rem; color: var(--accent-bright); display:flex; align-items:center; gap:8px; margin-bottom: 6px; }
  .logo .cursor-blip{ width:8px; height:8px; background: var(--green); border-radius:50%; box-shadow: 0 0 8px var(--green); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }
  .sb-tagline{ font-family: var(--mono); font-size: 0.72rem; color: var(--text-dim); margin-bottom: 34px; padding-left: 16px; }
  .sb-nav{ display:flex; flex-direction:column; gap: 4px; }
  .sb-nav a{ font-family: var(--mono); font-size: 0.86rem; color: var(--text-muted); padding: 9px 12px; border-radius: 6px; display:flex; align-items:center; gap:10px; }
  .sb-nav a .bullet{ color: var(--text-dim); }
  .sb-nav a:hover{ background: var(--surface); color: var(--accent-bright); }
  .sb-nav a.active{ background: var(--surface-hi); color: var(--accent-bright); font-weight:600; }
  .sb-nav a.active .bullet{ color: var(--green); }
  
  /* CONTENT LAYOUT */
  .main{ margin-left: var(--sidebar-w); min-height: 100vh; padding: 60px 0; }
  h1{ font-family: var(--mono); font-weight: 800; font-size: 2.2rem; color: var(--text); margin-bottom: 8px; }
  .subtitle{ font-family: var(--mono); color: var(--text-dim); font-size: 0.9rem; margin-bottom: 40px; }
  
  /* FIXED 2x3 GRID CONTAINER */
  .panel-matrix-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* Clean 2 Columns */
    grid-template-rows: repeat(3, 1fr);    /* Clean 3 Rows */
    gap: 16px;
    width: 100%;
    margin-top: 20px;
    box-sizing: border-box;
  }

  /* STRUCTURAL MATRIX CARD HOOKS */
  .matrix-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), 
                border-color 0.25s ease, 
                box-shadow 0.25s ease;
  }

  .matrix-content {
    position: relative;
    z-index: 2;
  }

  .matrix-tag {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }

  .matrix-title {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--text);
    margin-bottom: 4px;
    letter-spacing: -0.02em;
  }

  .matrix-title .accent-dot { color: var(--accent); }
  .matrix-title .accent-dot.green { color: var(--green); }

  .matrix-desc {
    font-size: 0.88rem;
    color: var(--text-muted);
    max-width: 45ch;
    line-height: 1.4;
  }

  .matrix-glow-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 1;
  }

  .matrix-card:hover {
    transform: translateY(-3px);
  }

  .matrix-card:hover .matrix-glow-overlay {
    opacity: 1;
  }

  /* PURPLE NEON GLOW */
  .matrix-card.glow-purple:hover {
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(167, 139, 250, 0.12);
  }
  .matrix-card.glow-purple .matrix-glow-overlay {
    background: radial-gradient(circle at 50% 100%, rgba(167, 139, 250, 0.08), transparent 70%);
  }
  .matrix-card.glow-purple:hover .matrix-title {
    color: var(--accent-bright);
  }

  /* GREEN NEON GLOW */
  .matrix-card.glow-green:hover {
    border-color: var(--green);
    box-shadow: 0 8px 24px rgba(126, 231, 135, 0.1);
  }
  .matrix-card.glow-green .matrix-glow-overlay {
    background: radial-gradient(circle at 50% 100%, rgba(126, 231, 135, 0.06), transparent 70%);
  }
  .matrix-card.glow-green:hover .matrix-title {
    color: #c9ffd0;
  }

  /* MOBILE RESPONSIVENESS */
  @media (max-width: 768px) {
    .panel-matrix-container {
      grid-template-columns: 1fr; /* Stack directly on mobile screens */
    }
  }
  /* ==========================================
   STYLE VARIANT 03: WHITISH-GREY GLOW EFFECT
   ========================================== */
.matrix-card.glow-white:hover {
  border-color: #e9e4f7; /* Matches your --text token */
  box-shadow: 0 8px 24px rgba(233, 228, 247, 0.12),
              0 0 10px rgba(233, 228, 247, 0.05);
}
.matrix-card.glow-white .matrix-glow-overlay {
  background: radial-gradient(circle at 50% 100%, rgba(233, 228, 247, 0.06), transparent 70%);
}
.matrix-card.glow-white:hover .matrix-title {
  color: #ffffff;
}

/* ==========================================
   STYLE VARIANT 04: GOLD CYBERPUNK GLOW EFFECT
   ========================================== */
.matrix-card.glow-gold:hover {
  border-color: #f1c40f; /* Cyberpunk Terminal Gold */
  box-shadow: 0 8px 24px rgba(241, 196, 15, 0.15),
              0 0 10px rgba(241, 196, 15, 0.05);
}
.matrix-card.glow-gold .matrix-glow-overlay {
  background: radial-gradient(circle at 50% 100%, rgba(241, 196, 15, 0.08), transparent 70%);
}
.matrix-card.glow-gold:hover .matrix-title {
  color: #ffeaa7; /* Soft gold text highlight on hover */
}
.matrix-card.glow-gold:hover .matrix-title .accent-dot {
  color: #f1c40f;
}

</style>
</head>

        <!-- BUTTON 02 -->

</body>
</html>
